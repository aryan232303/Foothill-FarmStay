<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FileInput WebP Image Converter</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #eee; }
    .status { margin-bottom: 20px; color: #4af; font-size: 18px; }
    textarea { width: 100%; height: 300px; background: #222; color: #0f0; border: 1px solid #444; font-size: 12px; }
    input[type="file"] { padding: 15px; background: #333; color: #fff; border: 2px dashed #666; width: 100%; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Foothill Image WebP Converter (FileInput Mode)</h1>
  <p>Select image files to convert to optimized WebP base64 format.</p>
  <input type="file" id="fileInput" multiple accept="image/*">
  <div id="status" class="status">Waiting for file selection...</div>
  <textarea id="output"></textarea>

  <script>
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    window.results = {};
    window.CONVERT_DONE = false;

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      statusEl.textContent = `Processing ${files.length} files...`;
      window.results = {};

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusEl.textContent = `Converting (${i + 1}/${files.length}): ${file.name}...`;

        try {
          // Determine target dimension based on filename/type
          let maxW = 1200;
          if (file.name.includes('9711') || file.name.includes('9712') || file.name.includes('9713')) maxW = 1600;
          if (file.name.includes('logo') || file.name.includes('Logo')) maxW = 600;
          if (file.name.includes('cottage') || file.name.includes('hall') || file.name.includes('lawn')) maxW = 1000;

          const webpData = await processFileToWebP(file, maxW, 0.82);
          window.results[file.name] = {
            name: file.name,
            originalSize: file.size,
            webpData: webpData,
            webpSize: Math.round((webpData.length * 3) / 4)
          };
        } catch (err) {
          console.error(`Error converting ${file.name}:`, err);
        }
      }

      statusEl.textContent = `COMPLETED! Converted ${Object.keys(window.results).length} files cleanly.`;
      outputEl.value = JSON.stringify(window.results, null, 2);
      window.CONVERT_DONE = true;
    });

    function processFileToWebP(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;

            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            const dataUrl = canvas.toDataURL('image/webp', quality);
            resolve(dataUrl);
          };
          img.onerror = reject;
          img.src = e.target.result; // Data URL is non-tainted!
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
